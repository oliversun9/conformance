name: Connect Unexpected Stream Headers
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_CONNECT
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_PROTO
# Each case sends a well-formed server stream (one data message, then an
# EndStreamResponse of {}) under a status or header the Connect protocol
# reference does not allow. The spec says a streaming response always has
# status 200 and otherwise gives the client no rule, so the first case expects
# the HTTP-to-code mapping for its status and the others are placeholders: an
# error code the reference client reports, or a success carrying the payload. A
# response with no content-type at all is not among them: the Go reference
# server's net/http sniffs one (application/octet-stream) whenever none is set.
testCases:
  - request:
      testName: non-200-status
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              statusCode: 503
              headers:
                - name: content-type
                  value: [ "application/connect+proto" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      error:
        code: CODE_UNAVAILABLE
  - request:
      testName: invalid-content-type
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/proto" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      error:
        code: CODE_UNKNOWN
  - request:
      testName: content-type-parameters
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+proto; charset=utf-8" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ"
  - request:
      testName: unknown-connect-content-encoding
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+proto" ]
                - name: connect-content-encoding
                  value: [ "snappy" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      error:
        code: CODE_INTERNAL
  - request:
      testName: binary-header-bad-base64
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+proto" ]
                - name: acme-token-bin
                  value: [ "invalid@" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ"
  - request:
      testName: reserved-header
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+proto" ]
                - name: connect-foo
                  value: [ "bar" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ"
