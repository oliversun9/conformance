name: gRPC-Web Malformed Status Metadata
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_GRPC_WEB
relevantCodecs:
  - CODEC_PROTO
relevantCompressions:
  - COMPRESSION_IDENTITY
# Same inputs, sent as the in-body trailer block (frame flags 128), plus
# bad-utf8, whose trailer block is the single byte 0xff (base64 "/w==").
testCases:
  - request:
      testName: invalid-status
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              statusCode: 200
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 128
                    payload:
                      text: "grpc-status: invalid\r\n"
    otherAllowedErrorCodes:
      - CODE_INTERNAL
    expectedResponse:
      error:
        code: CODE_UNKNOWN

  - request:
      testName: bad-base64
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              statusCode: 200
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 128
                    payload:
                      text: "grpc-status: 16\r\ngrpc-status-details-bin: invalid@\r\n"
    otherAllowedErrorCodes:
      - CODE_INTERNAL
    expectedResponse:
      error:
        code: CODE_UNAUTHENTICATED

  - request:
      testName: bad-protobuf
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              statusCode: 200
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 128
                    payload:
                      text: "grpc-status: 16\r\ngrpc-status-details-bin: AA==\r\n"
    otherAllowedErrorCodes:
      - CODE_INTERNAL
    expectedResponse:
      error:
        code: CODE_UNAUTHENTICATED

  - request:
      testName: bad-percent
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              statusCode: 200
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 128
                    payload:
                      text: "grpc-status: 16\r\ngrpc-message: %\r\n"
    expectedResponse:
      error:
        code: CODE_UNAUTHENTICATED
        message: "%"

  - request:
      testName: bad-utf8
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              statusCode: 200
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 128
                    payload:
                      binary: "/w=="
    otherAllowedErrorCodes:
      - CODE_INTERNAL
    expectedResponse:
      error:
        code: CODE_UNKNOWN
