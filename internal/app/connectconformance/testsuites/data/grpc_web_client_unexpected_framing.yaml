name: gRPC-Web Unexpected Framing
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_GRPC_WEB
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_PROTO
# Each case sends a unary response with valid headers (content-type
# application/grpc-web) whose body breaks one rule of the gRPC-Web framing: the
# trailer frame is missing, early, malformed, not UTF-8, or replaced by HTTP
# trailers. The gRPC-Web document says the trailer frame must be last and the
# status is read from it, but names no client code, so every expectation is a
# placeholder: INTERNAL, the code the existing no-terminal-status case expects,
# except the non-UTF-8 block, which still carries a readable grpc-status.
testCases:
  - request:
      testName: web-no-trailer-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
    expectedResponse:
      error:
        code: CODE_INTERNAL
  - request:
      testName: web-trailer-frame-not-last
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 128
                    payload:
                      text: "grpc-status: 0\r\n"
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
    expectedResponse:
      error:
        code: CODE_INTERNAL
  - request:
      # The trailer block has no ": " separator and no CRLF.
      testName: web-malformed-trailer-block
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
                  - flags: 128
                    payload:
                      text: "grpc-status 0"
    expectedResponse:
      error:
        code: CODE_INTERNAL
  - request:
      # The block is "grpc-status: 16\r\nacme-note: \xff\r\n": a byte that is
      # not UTF-8 in a custom trailer next to a readable status.
      testName: web-trailer-non-utf8
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
                  - flags: 128
                    payload:
                      binary: "Z3JwYy1zdGF0dXM6IDE2DQphY21lLW5vdGU6IP8NCg=="
    expectedResponse:
      error:
        code: CODE_UNAUTHENTICATED
  - request:
      # The status travels as HTTP trailers, which gRPC-Web does not use.
      testName: web-trailers-as-http-trailers
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ"
              trailers:
                - name: grpc-status
                  value: [ "0" ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
