name: Connect Unexpected EndStreamResponse
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_CONNECT
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_JSON
# Each case sends status 200, content-type application/connect+json, one empty
# data message ({}), and an EndStreamResponse envelope whose message breaks one
# rule of the Connect protocol reference. The spec gives the client no code for
# any of them, so each expectation is a placeholder: INTERNAL, the code the
# reference client reports for an EndStreamResponse it cannot parse, where the
# value is not even the right JSON type, and a success carrying the payload for
# the metadata cases, where a client may well pass the metadata through.
testCases:
  - request:
      testName: not-json
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+json" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: "{}"
                  - flags: 2
                    payload:
                      text: "<html>"
    expectedResponse:
      payloads:
        - { }
      error:
        code: CODE_INTERNAL
  - request:
      # \x00\x00\x00\x00\x02{}\x02\x00\x00\x00\x00: a zero-length EndStreamResponse.
      testName: empty
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+json" ]
              unary:
                binary: "AAAAAAJ7fQIAAAAA"
    expectedResponse:
      payloads:
        - { }
      error:
        code: CODE_INTERNAL
  - request:
      testName: not-object
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+json" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: "{}"
                  - flags: 2
                    payload:
                      text: "[]"
    expectedResponse:
      payloads:
        - { }
      error:
        code: CODE_INTERNAL
  - request:
      testName: error-null
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+json" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: "{}"
                  - flags: 2
                    payload:
                      text: '{"error": null}'
    expectedResponse:
      payloads:
        - { }
      error:
        code: CODE_INTERNAL
  - request:
      testName: error-not-object
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+json" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: "{}"
                  - flags: 2
                    payload:
                      text: '{"error": "unavailable"}'
    expectedResponse:
      payloads:
        - { }
      error:
        code: CODE_INTERNAL
  - request:
